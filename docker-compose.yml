services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    env_file:
      - .env
    environment:
      LOAD_FIXTURES: "true"

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine

    env_file:
      - .env

    ports:
      - "6543:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  test_db:
    image: postgres:17-alpine

    env_file:
      - .env.test

    ports:
      - "6544:5432"

    tmpfs:
      - /var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d test_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: